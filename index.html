<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>By B · 중고 가전 시세 분석기</title>
  <meta name="description" content="정률법 기반으로 중고 가전의 적정 시세를 자동 산출해 드립니다. 결혼·이사 준비의 첫 단추, By B." />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <!-- Header -->
    <header class="app__header">
      <span class="brand-chip">By B</span>
      <h1 class="title">지금 팔면<br />얼마 받을 수 있을까요?</h1>
      <p class="subtitle">정률법으로 계산한 합리적인 중고 가전 시세를 알려드릴게요.</p>
    </header>

    <!-- Calculator -->
    <section class="calculator" aria-label="시세 계산기">
      <form id="calc-form" novalidate>
        <!-- 1. Category -->
        <fieldset class="field">
          <legend class="field__label">어떤 제품인가요?</legend>
          <div class="segment" role="radiogroup">
            <label class="segment__item">
              <input type="radio" name="category" value="major" checked />
              <span class="segment__body">
                <span class="segment__title">대형가전</span>
                <span class="segment__desc">냉장고 · 세탁기 · TV</span>
              </span>
            </label>
            <label class="segment__item">
              <input type="radio" name="category" value="digital" />
              <span class="segment__body">
                <span class="segment__title">디지털기기</span>
                <span class="segment__desc">노트북 · 태블릿 · 폰</span>
              </span>
            </label>
          </div>
        </fieldset>

        <!-- 2. Price -->
        <div class="field">
          <label class="field__label" for="price">새 제품 가격</label>
          <div class="input-money">
            <input
              type="text"
              id="price"
              name="price"
              inputmode="numeric"
              autocomplete="off"
              placeholder="0"
            />
            <span class="input-money__unit">원</span>
          </div>
          <p class="field__hint" id="price-hint">구매 당시 가격을 입력해 주세요.</p>
        </div>

        <!-- 3. Usage years -->
        <div class="field">
          <label class="field__label" for="years">얼마나 사용했나요?</label>
          <div class="select-wrap">
            <select id="years" name="years">
              <option value="0">미개봉이에요</option>
              <option value="1">1년</option>
              <option value="2">2년</option>
              <option value="3">3년</option>
              <option value="4">4년</option>
              <option value="5" selected>5년</option>
              <option value="6">6년</option>
              <option value="7">7년</option>
              <option value="8">8년</option>
              <option value="9">9년</option>
              <option value="10">10년 이상</option>
            </select>
          </div>
        </div>

        <!-- 4. Condition chips -->
        <fieldset class="field">
          <legend class="field__label">상태는 어떤가요?</legend>
          <div class="chips" role="radiogroup">
            <label class="chip">
              <input type="radio" name="condition" value="1.10" />
              <span class="chip__body">
                <span class="chip__grade">S급</span>
                <span class="chip__desc">미개봉</span>
              </span>
            </label>
            <label class="chip">
              <input type="radio" name="condition" value="1.00" checked />
              <span class="chip__body">
                <span class="chip__grade">A급</span>
                <span class="chip__desc">기스 없음</span>
              </span>
            </label>
            <label class="chip">
              <input type="radio" name="condition" value="0.85" />
              <span class="chip__body">
                <span class="chip__grade">B급</span>
                <span class="chip__desc">사용감 있음</span>
              </span>
            </label>
          </div>
        </fieldset>

        <button type="submit" class="btn-primary" id="calc-btn">시세 확인하기</button>
      </form>
    </section>

    <!-- Result -->
    <section class="result is-hidden" id="result" aria-live="polite">
      <p class="result__eyebrow">이 가격이면 적당해요</p>
      <p class="result__headline">
        <span class="result__price" id="final-price">0</span><span class="result__won">원</span>
      </p>
      <p class="result__note" id="depreciation-note"></p>

      <!-- Range bar -->
      <div class="range">
        <div class="range__track">
          <div class="range__fill"></div>
          <div class="range__marker" title="적정 추천가"></div>
        </div>
        <div class="range__labels">
          <div class="range__end">
            <span class="range__cap">이 아래로는 손해</span>
            <span class="range__val" id="min-price">0원</span>
          </div>
          <div class="range__end range__end--right">
            <span class="range__cap">이 위로는 안 팔려요</span>
            <span class="range__val" id="max-price">0원</span>
          </div>
        </div>
      </div>

      <!-- Breakdown -->
      <div class="breakdown-wrap">
        <h2 class="breakdown-title">계산 근거</h2>
        <ul class="breakdown" id="breakdown"></ul>
      </div>
    </section>

    <footer class="app__footer">
      <p>산출 결과는 참고용이에요. 실제 거래가와 다를 수 있어요.</p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
